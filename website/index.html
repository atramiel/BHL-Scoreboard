<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Hockey League</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="logo.png" alt="">Bot Hockey League</a>
  <a href="index.html" class="active">Teams</a>
  <a href="rankings.html">Rankings</a>
  <a href="events.html">Events</a>
  <a href="hall-of-fame.html">Hall of Fame</a>
  <a href="about.html">What is Bot Hockey?</a>
</nav>
<div class="wrap">
  <div class="hero">
    <img src="logo.png" alt="BHL logo">
    <div>
      <h1>Bot Hockey League</h1>
      <div class="tag">Robots. Ice-cold competition. Real bragging rights. Meet the teams, follow the events, and watch the rankings shift after every game night.</div>
    </div>
  </div>

  <div id="nationalChampionBanner"></div>

  <h2>The Teams</h2>
  <div class="grid" id="teams"></div>

  <h2>Recent Results</h2>
  <div style="overflow-x:auto">
    <table id="recent">
      <thead><tr><th>Date</th><th>Event</th><th>Matchup</th><th>Score</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(async function () {
  const [{ data: teams }, { data: games }, { data: champs }, canon] = await Promise.all([
    sb.from("teams_public").select("*").order("name"),
    sb.from("games").select("*").order("played_at", { ascending: false }),
    sb.from("champions").select("*").eq("is_national", true),
    loadAliasMap(),
  ]);

  // Reigning National Champion — the league's biggest title, front and center
  const nationalTitles = (champs ?? []).sort((a, b) => (b.event_date ?? "") < (a.event_date ?? "") ? -1 : 1);
  const champion = nationalTitles[0];
  const currentChampionName = champion ? canon(champion.team_name, champion.event_name) : null;
  const currentChampionYear = champion?.event_date ? new Date(champion.event_date + "T00:00:00").getFullYear() : null;

  if (champion) {
    const champTeam = (teams ?? []).find(t => t.name === currentChampionName);
    document.getElementById("nationalChampionBanner").innerHTML = `
      <a class="card" href="hall-of-fame.html" style="display:flex; gap:18px; align-items:center; border:2px solid var(--gold); background:linear-gradient(180deg, #3a3016, var(--panel)); margin-bottom:24px; text-decoration:none; color:inherit">
        ${logoHtml(champTeam ?? { name: currentChampionName }, "team-logo champion-logo-lg")}
        <div>
          <div class="meta" style="text-transform:uppercase; letter-spacing:.1em; color:var(--gold)">🏆 Reigning National Champion</div>
          <div style="font-family:Garamond,Georgia,serif; font-size:36px; font-weight:700; margin:4px 0">${esc(currentChampionName)}</div>
          <div class="meta">${currentChampionYear} National Championship</div>
        </div>
      </a>`;
  }

  document.getElementById("teams").innerHTML = (teams ?? []).map(t => {
    const r = recordFor(games ?? [], t.name, canon);
    const crown = t.name === currentChampionName ? ' <span class="badge gold">👑</span>' : "";
    return `<a class="card team-card" href="team.html?team=${encodeURIComponent(t.slug)}">
      ${logoHtml(t)}
      <div>
        <h3>${esc(t.name)}${crown}</h3>
        <div class="meta">${esc(t.home_town || "")}</div>
        <div class="meta">Bots: ${esc(t.bots || "—")} · ${r.w}–${r.l}</div>
      </div>
    </a>`;
  }).join("") || "<p class='sub'>No teams yet — the league admin creates teams and sends each captain a private edit link.</p>";

  document.querySelector("#recent tbody").innerHTML = (games ?? []).slice(0, 20).map(g => `<tr>
    <td>${fmtDate(g.played_at)}</td>
    <td class="small">${esc(g.event_name || "")}</td>
    <td>${matchupHtml(g, canon)}</td>
    <td class="num">${scoreText(g)}</td>
    <td>${g.overtime ? '<span class="badge red">OT</span>' : ""}
        ${g.championship ? '<span class="badge gold">Championship</span>' : ""}</td>
  </tr>`).join("") || "<tr><td colspan='5' class='small'>No games recorded yet.</td></tr>";
})();
</script>
</body>
</html>
