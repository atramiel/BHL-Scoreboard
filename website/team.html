<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — Bot Hockey League</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="logo.png" alt="">Bot Hockey League</a>
  <a href="index.html">Teams</a>
  <a href="rankings.html">Rankings</a>
  <a href="events.html">Events</a>
  <a href="hall-of-fame.html">Hall of Fame</a>
  <a href="about.html">What is Bot Hockey?</a>
</nav>
<div class="wrap">
  <div class="team-head" id="head"></div>
  <div class="grid" id="facts" style="margin-top:20px"></div>

  <div id="gallerySection"></div>

  <h2>Events</h2>
  <div id="eventsList"></div>

  <h2>Game History</h2>
  <p class="sub" id="record"></p>
  <div style="overflow-x:auto">
    <table id="history">
      <thead><tr><th>Date</th><th>Event</th><th>Opponent</th><th>Result</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="rivalrySection"></div>

  <div id="editSection" style="display:none">
    <h2>Edit Your Profile</h2>
    <p class="sub">You're here via your team's private edit link. Changes go live immediately.</p>
    <div class="notice" id="editNotice"></div>
    <form class="stack" id="editForm">
      <label class="field">Team name (must match your Challonge name)
        <input name="name" required></label>
      <label class="field">Driver names
        <input name="drivers" placeholder="e.g. Alex, Sam"></label>
      <label class="field">Bot names
        <input name="bots" placeholder="e.g. Slapshot, Ice Breaker"></label>
      <label class="field">Special features
        <textarea name="special_features" placeholder="What makes your bots dangerous?"></textarea></label>
      <label class="field">Home town
        <input name="home_town"></label>
      <label class="field">Motto / tagline
        <input name="motto"></label>
      <label class="field">Date established
        <input name="established" placeholder="e.g. 2019 or April 2019"></label>
      <label class="field">Team logo (PNG/JPG, up to 5 MB)
        <input type="file" id="logoFile" accept="image/*"></label>
      <div class="field" style="display:flex; flex-direction:column; gap:5px; font-size:14px; color:var(--ink-soft)">
        Bot roster — one card per bot
        <div id="botEditor" style="display:flex; flex-direction:column; gap:10px"></div>
        <button type="button" class="quiet" id="addBotBtn" style="margin-top:4px">+ Add a bot</button>
      </div>
      <label class="field">Add bot photos (you can pick several)
        <input type="file" id="photoFiles" accept="image/*" multiple></label>
      <div id="photoManager" class="gallery"></div>
      <button type="submit" id="saveBtn">Save profile</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(async function () {
  const slug = qs("team");
  const editKey = qs("key");
  const head = document.getElementById("head");
  if (!slug) { head.innerHTML = "<h1>Team not found</h1>"; return; }

  const { data: teams } = await sb.from("teams_public").select("*").eq("slug", slug).limit(1);
  const team = teams?.[0];
  if (!team) { head.innerHTML = "<h1>Team not found</h1>"; return; }

  let photos = Array.isArray(team.bot_photos) ? [...team.bot_photos] : [];

  document.title = team.name + " — Bot Hockey League";
  head.innerHTML = `${logoHtml(team)}
    <div>
      <h1>${esc(team.name)}</h1>
      ${team.motto ? `<div class="motto">“${esc(team.motto)}”</div>` : ""}
      <div class="meta small">${esc([team.home_town, team.established && `Est. ${team.established}`].filter(Boolean).join(" · "))}</div>
    </div>`;

  // Bot roster cards + photo gallery
  let roster = Array.isArray(team.bot_roster) ? team.bot_roster.map(b => ({ ...b })) : [];
  let galleryHtml = "";
  if (roster.length) {
    galleryHtml += "<h2>The Bots</h2><div class='grid'>" + roster.map(b => `
      <div class="card" style="padding:0; overflow:hidden">
        ${b.photo_url ? `<img src="${esc(b.photo_url)}" alt="${esc(b.name)}" style="width:100%; aspect-ratio:4/3; object-fit:cover; display:block">` : ""}
        <div style="padding:14px 16px">
          <h3 style="margin:0 0 6px">${esc(b.name || "Unnamed bot")}</h3>
          ${[["Weight", b.weight], ["Weapon", b.weapon], ["Primary driver", b.driver], ["Built", b.built]]
            .filter(([, v]) => v)
            .map(([k, v]) => `<div class="small"><span class="meta">${k}:</span> ${esc(v)}</div>`).join("")}
        </div>
      </div>`).join("") + "</div>";
  }
  if (photos.length) {
    galleryHtml += "<h2>Gallery</h2><div class='gallery'>" +
      photos.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="bot photo"></a>`).join("") +
      "</div>";
  }
  document.getElementById("gallerySection").innerHTML = galleryHtml;

  // Games, record, per-event placements — alias-aware: any name this team has
  // competed under (renames, sub-teams) counts toward their history.
  const [{ data: allGames }, { data: allChamps }, { data: allRivalries }, canon] = await Promise.all([
    sb.from("games").select("*").order("played_at", { ascending: false }),
    sb.from("champions").select("*"),
    sb.from("rivalries").select("*"),
    loadAliasMap(),
  ]);
  const me = canon(team.name);
  const games = (allGames ?? []).filter(g => canon(g.team1_name) === me || canon(g.team2_name) === me);
  const champs = (allChamps ?? []).filter(c => canon(c.team_name) === me);
  const rivalries = (allRivalries ?? []).filter(rv => canon(rv.team_a) === me || canon(rv.team_b) === me);

  // Fact cards (rivals come from the rivalries table)
  const rivalNames = rivalries.map(rv => canon(rv.team_a) === me ? rv.team_b : rv.team_a);
  document.getElementById("facts").innerHTML = [
    ["Drivers", team.drivers], ["Bots", team.bots],
    ["Special features", team.special_features],
    ["Home town", team.home_town], ["Established", team.established],
    ["Rivals", rivalNames.join(", ")],
  ].map(([k, v]) => `<div class="card"><div class="meta">${k}</div><div>${esc(v || "—")}</div></div>`).join("");

  const r = recordFor(games, team.name, canon);
  document.getElementById("record").textContent = `All-time: ${r.w} wins, ${r.l} losses`;

  // Events section: every event this team appeared in, with W-L and podium finish
  const medal = (p) => p === 1 ? "🥇 Champion" : p === 2 ? "🥈 2nd place" : "🥉 3rd place";
  const byEvent = new Map();
  for (const g of games) {
    const name = g.event_name || "Other Games";
    const e = byEvent.get(name) ?? { games: [], champ: null };
    e.games.push(g); byEvent.set(name, e);
  }
  for (const c of champs) {
    const e = byEvent.get(c.event_name) ?? { games: [], champ: null };
    e.champ = c; byEvent.set(c.event_name, e);
  }
  document.getElementById("eventsList").innerHTML = [...byEvent.entries()].map(([name, e]) => {
    const er = recordFor(e.games, team.name, canon);
    // Which identities (renames/sub-squads) did this team field at this event?
    const squads = new Map();
    for (const g of e.games)
      for (const [raw, won] of [[g.team1_name, g.team1_score > g.team2_score], [g.team2_name, g.team2_score > g.team1_score]]) {
        if (canon(raw) !== me) continue;
        const s = squads.get(raw) ?? { w: 0, l: 0 };
        won ? s.w++ : s.l++;
        squads.set(raw, s);
      }
    const squadLine = squads.size > 1
      ? `<div class="meta">Fielded ${squads.size} squads: ${[...squads.entries()]
          .map(([raw, s]) => `${esc(raw)} (${s.w}–${s.l})`).join(" · ")}</div>`
      : "";
    return `<div class="card" style="margin-bottom:10px">
      <h3>${esc(name)} ${e.champ ? `<span class="badge gold">${medal(e.champ.place)}</span>` : ""}
        ${e.champ?.era === "Legacy" ? '<span class="badge blue">Legacy</span>' : ""}</h3>
      <div class="meta">${e.games.length ? `Record: ${er.w}–${er.l}` : "No games recorded"}
        ${e.champ?.notes ? ` · ${esc(e.champ.notes)}` : ""}</div>
      ${squadLine}
    </div>`;
  }).join("") || "<p class='sub'>No events yet.</p>";

  document.querySelector("#history tbody").innerHTML = games.map(g => {
    const home = canon(g.team1_name) === me;
    const my = home ? g.team1_score : g.team2_score;
    const their = home ? g.team2_score : g.team1_score;
    const opp = home ? g.team2_name : g.team1_name;
    return `<tr>
      <td>${fmtDate(g.played_at)}</td>
      <td class="small">${esc(g.event_name || "")}</td>
      <td>${esc(opp)}</td>
      <td class="num">${my > their ? "W" : "L"} ${g.scores_counted === false ? "" : `${my}–${their}`}</td>
      <td>${g.overtime ? '<span class="badge red">OT</span>' : ""}
          ${g.championship ? '<span class="badge gold">Championship</span>' : ""}</td>
    </tr>`;
  }).join("") || "<tr><td colspan='5' class='small'>No games yet.</td></tr>";

  if (rivalries?.length) {
    document.getElementById("rivalrySection").innerHTML = "<h2>Rivalries</h2>" +
      rivalries.map(rv => `<div class="card rivalry" style="margin-bottom:10px">
        <h3>${esc(rv.team_a)} vs ${esc(rv.team_b)}</h3>
        <div>${esc(rv.story)}</div>
      </div>`).join("");
  }

  // ---------- Edit mode via secret link ----------
  if (!editKey) return;
  const form = document.getElementById("editForm");
  const notice = document.getElementById("editNotice");
  const saveBtn = document.getElementById("saveBtn");
  document.getElementById("editSection").style.display = "block";
  for (const f of ["name", "drivers", "bots", "special_features", "home_town", "motto", "established"])
    form.elements[f].value = team[f] || "";

  // Bot roster editor: each bot is a small sub-form; photos upload on save
  const botEditor = document.getElementById("botEditor");
  function renderBotEditor() {
    botEditor.innerHTML = roster.map((b, i) => `
      <div class="card" data-bot="${i}" style="display:flex; flex-direction:column; gap:8px">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <strong>${esc(b.name || "New bot")}</strong>
          <button type="button" class="quiet" data-remove-bot="${i}" style="padding:2px 10px">✕ Remove</button>
        </div>
        <input data-f="name" placeholder="Bot name" value="${esc(b.name || "")}">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
          <input data-f="weight" placeholder="Weight (e.g. 15 lbs)" value="${esc(b.weight || "")}">
          <input data-f="built" placeholder="Built (e.g. 2023)" value="${esc(b.built || "")}">
        </div>
        <input data-f="weapon" placeholder="Weapon / play style" value="${esc(b.weapon || "")}">
        <input data-f="driver" placeholder="Primary driver" value="${esc(b.driver || "")}">
        <label class="field">Photo ${b.photo_url ? "(replaces current)" : ""}
          <input type="file" data-f="photo" accept="image/*"></label>
      </div>`).join("");
  }
  function readBotEditor() {
    for (const row of botEditor.querySelectorAll("[data-bot]")) {
      const i = parseInt(row.dataset.bot, 10);
      for (const f of ["name", "weight", "built", "weapon", "driver"])
        roster[i][f] = row.querySelector(`[data-f="${f}"]`).value.trim();
    }
  }
  botEditor.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-remove-bot]");
    if (!b) return;
    readBotEditor();
    roster.splice(parseInt(b.dataset.removeBot, 10), 1);
    renderBotEditor();
  });
  document.getElementById("addBotBtn").addEventListener("click", () => {
    readBotEditor();
    roster.push({ name: "", weight: "", weapon: "", driver: "", built: "", photo_url: "" });
    renderBotEditor();
  });
  renderBotEditor();

  const photoManager = document.getElementById("photoManager");
  function renderPhotoManager() {
    photoManager.innerHTML = photos.map((u, i) =>
      `<div style="position:relative">
        <img src="${esc(u)}" alt="" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px">
        <button type="button" class="quiet" data-i="${i}" style="position:absolute;top:6px;right:6px;padding:2px 10px">✕</button>
      </div>`).join("");
  }
  photoManager.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    photos.splice(parseInt(b.dataset.i, 10), 1);
    renderPhotoManager();
  });
  renderPhotoManager();

  const stamp = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const ext = (f) => (f.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      let logoUrl = team.logo_url || "";
      const logoFile = document.getElementById("logoFile").files[0];
      if (logoFile)
        logoUrl = await uploadMedia(logoFile, `${slug}/logo-${stamp()}.${ext(logoFile)}`);

      for (const f of document.getElementById("photoFiles").files)
        photos.push(await uploadMedia(f, `${slug}/bot-${stamp()}.${ext(f)}`));

      // Bot roster: read fields, upload any newly chosen bot photos
      readBotEditor();
      for (const row of botEditor.querySelectorAll("[data-bot]")) {
        const i = parseInt(row.dataset.bot, 10);
        const file = row.querySelector('[data-f="photo"]').files[0];
        if (file)
          roster[i].photo_url = await uploadMedia(file, `${slug}/roster-${stamp()}.${ext(file)}`);
      }

      const v = (n) => form.elements[n].value.trim();
      const { data, error } = await sb.rpc("update_team", {
        p_slug: slug, p_key: editKey,
        p_name: v("name"), p_drivers: v("drivers"), p_bots: v("bots"),
        p_special_features: v("special_features"), p_home_town: v("home_town"),
        p_motto: v("motto"), p_logo_url: logoUrl, p_bot_photos: photos,
        p_established: v("established"), p_bot_roster: roster,
      });
      if (error || data !== true) throw (error ?? new Error("bad edit link"));
      showNotice(notice, true, "Profile saved — reloading…");
      setTimeout(() => location.reload(), 800);
    } catch (err) {
      showNotice(notice, false, "Save failed: " + (err.message || "is your edit link correct?"));
      saveBtn.disabled = false;
      saveBtn.textContent = "Save profile";
    }
  });
})();
</script>
</body>
</html>
