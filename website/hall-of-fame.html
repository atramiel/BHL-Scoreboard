<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall of Fame — Bot Hockey League</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html">Bot Hockey League</a>
  <a href="index.html">Teams</a>
  <a href="hall-of-fame.html" class="active">Hall of Fame</a>
  <a href="about.html">What is Bot Hockey?</a>
</nav>
<div class="wrap">
  <h1>Hall of Fame</h1>
  <p class="sub">Champions of every BHL event, past and present.</p>

  <div id="champions"></div>

  <h2>Awards</h2>
  <div style="overflow-x:auto">
    <table id="awards">
      <thead><tr><th>Event</th><th>Award</th><th>Team</th><th>Notes</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>Rivalries</h2>
  <div id="rivalries"></div>

  <h2 id="historyTitle">League History</h2>
  <div class="content-body" id="historyBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(async function () {
  const medal = (p) => p === 1 ? "🥇" : p === 2 ? "🥈" : "🥉";

  const { data: champs } = await sb.from("champions").select("*")
    .order("event_date", { ascending: false }).order("place");
  const byEvent = {};
  for (const c of champs ?? []) (byEvent[c.event_name] ??= []).push(c);
  document.getElementById("champions").innerHTML = Object.entries(byEvent).map(([ev, rows]) =>
    `<div class="card" style="margin-bottom:12px">
      <h3>${esc(ev)} <span class="meta">${rows[0].event_date ? new Date(rows[0].event_date + "T00:00:00").toLocaleDateString() : ""}</span></h3>
      ${rows.map(r => `<div>${medal(r.place)} ${esc(r.team_name)} ${r.notes ? `<span class="meta">— ${esc(r.notes)}</span>` : ""}</div>`).join("")}
    </div>`).join("") || "<p class='sub'>No champions recorded yet — the admin can seed past events on the Admin page.</p>";

  const { data: awards } = await sb.from("awards").select("*").order("event_name");
  document.querySelector("#awards tbody").innerHTML = (awards ?? []).map(a => `<tr>
    <td>${esc(a.event_name)}</td><td>${esc(a.award_name)}</td>
    <td>${esc(a.team_name)}</td><td class="small">${esc(a.notes || "")}</td>
  </tr>`).join("") || "<tr><td colspan='4' class='small'>No awards yet.</td></tr>";

  const { data: rivalries } = await sb.from("rivalries").select("*");
  document.getElementById("rivalries").innerHTML = (rivalries ?? []).map(rv =>
    `<div class="card rivalry" style="margin-bottom:10px">
      <h3>${esc(rv.team_a)} vs ${esc(rv.team_b)}</h3>
      <div>${esc(rv.story)}</div>
    </div>`).join("") || "<p class='sub'>No official rivalries… yet.</p>";

  const { data: content } = await sb.from("site_content").select("*").eq("key", "league-history").limit(1);
  if (content?.[0]) {
    document.getElementById("historyTitle").textContent = content[0].title;
    document.getElementById("historyBody").textContent = content[0].body;
  }
})();
</script>
</body>
</html>
