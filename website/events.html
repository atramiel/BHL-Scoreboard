<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — Bot Hockey League</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="logo.png" alt="">Bot Hockey League</a>
  <a href="index.html">Teams</a>
  <a href="rankings.html">Rankings</a>
  <a href="events.html" class="active">Events</a>
  <a href="hall-of-fame.html">Hall of Fame</a>
  <a href="about.html">What is Bot Hockey?</a>
</nav>
<div class="wrap">
  <h1>Events</h1>
  <p class="sub">Every BHL event — results, podiums, and awards.</p>
  <div id="events"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(async function () {
  const medal = (p) => p === 1 ? "🥇" : p === 2 ? "🥈" : "🥉";

  const [{ data: games }, { data: champs }, { data: awards }, { data: eventRows }] = await Promise.all([
    sb.from("games").select("*").order("played_at", { ascending: false }),
    sb.from("champions").select("*").order("place"),
    sb.from("awards").select("*"),
    sb.from("events").select("*"),
  ]);
  const eventInfo = new Map((eventRows ?? []).map(ev => [ev.name, ev]));

  // Collect every event name mentioned anywhere, with a representative date for sorting
  const events = new Map();
  const touch = (name, date) => {
    if (!name) name = "Other Games";
    const e = events.get(name) ?? { name, date: null, games: [], champs: [], awards: [] };
    if (date && (!e.date || date > e.date)) e.date = date;
    events.set(name, e);
    return e;
  };
  for (const g of games ?? []) touch(g.event_name, g.played_at).games.push(g);
  for (const c of champs ?? []) touch(c.event_name, c.event_date).champs.push(c);
  for (const a of awards ?? []) touch(a.event_name, null).awards.push(a);

  const sorted = [...events.values()].sort((a, b) => (b.date ?? "") < (a.date ?? "") ? -1 : 1);

  document.getElementById("events").innerHTML = sorted.map(e => `
    <div class="card" style="margin-bottom:16px">
      <h3>${esc(e.name)} <span class="meta">${esc(eventMeta(eventInfo.get(e.name)) || (e.date ? fmtDate(e.date) : ""))}</span>
        ${e.champs.some(c => c.era === "Legacy") ? '<span class="badge blue">Legacy</span>' : ""}</h3>
      ${e.champs.length ? `<div style="margin:6px 0">` +
        e.champs.map(c => `<div>${medal(c.place)} ${esc(c.team_name)} ${c.notes ? `<span class="meta">— ${esc(c.notes)}</span>` : ""}</div>`).join("") + `</div>` : ""}
      ${e.awards.length ? `<div style="margin:6px 0">` +
        e.awards.map(a => `<div>🏆 ${esc(a.award_name)}: ${esc(a.team_name)} ${a.notes ? `<span class="meta">— ${esc(a.notes)}</span>` : ""}</div>`).join("") + `</div>` : ""}
      ${e.games.length ? `<div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Matchup</th><th>Score</th><th></th></tr></thead>
        <tbody>` + e.games.map(g => `<tr>
          <td>${fmtDate(g.played_at)}</td>
          <td>${esc(g.team1_name)} vs ${esc(g.team2_name)}</td>
          <td class="num">${scoreText(g)}</td>
          <td>${g.overtime ? '<span class="badge red">OT</span>' : ""}
              ${g.championship ? '<span class="badge gold">Championship</span>' : ""}</td>
        </tr>`).join("") + `</tbody></table></div>`
        : `<div class="small">No game results recorded for this event.</div>`}
    </div>`).join("") || "<p class='sub'>No events yet — they'll appear here once champions or game results are recorded.</p>";
})();
</script>
</body>
</html>
